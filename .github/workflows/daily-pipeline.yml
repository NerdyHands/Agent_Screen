# Daily OneHome export → Airtable sync.
# Secrets required (Settings → Secrets and variables → Actions):
#   BROWSERBASE_API_KEY
#   BROWSERBASE_PROJECT_ID
#   ONEHOME_URL
#   AIRTABLE_PAT
#
# DRY_RUN is intentionally unset so production always writes.
# Edit table names below if your Airtable names differ.

name: Daily OneHome → Airtable

on:
  schedule:
    # 12:00 UTC ≈ 8:00 AM Eastern (EDT)
    - cron: "0 12 * * *"
  workflow_dispatch:

concurrency:
  group: daily-onehome-airtable
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
      BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
      ONEHOME_URL: ${{ secrets.ONEHOME_URL }}
      AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
      # Team workspace copy. Airtable base IDs are identifiers, not secrets.
      AIRTABLE_BASE_ID: app0j55AyIphSWR1J
      AIRTABLE_LISTINGS_TABLE: Listings
      AIRTABLE_CHANGE_LOG_TABLE: Change Log
      AIRTABLE_MOVED_LIST_TABLE: Moved List
      AIRTABLE_PENDING_LIST_TABLE: Pending List
      AIRTABLE_SOLD_LIST_TABLE: Sold List
      AIRTABLE_SYNC_RUNS_TABLE: Sync Runs

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required secrets
        run: |
          missing=()
          for key in BROWSERBASE_API_KEY BROWSERBASE_PROJECT_ID ONEHOME_URL AIRTABLE_PAT; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required GitHub Actions secrets: ${missing[*]}"
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Run export + Airtable sync
        run: npm run pipeline

      - name: List downloaded files
        if: always()
        run: |
          mkdir -p downloads
          ls -la downloads

      - name: Upload CSV and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onehome-export
          path: |
            downloads/*.csv
            downloads/*.png
          if-no-files-found: warn
          retention-days: 14
